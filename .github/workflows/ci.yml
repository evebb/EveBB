name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint + compatibility (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, mysqli, pgsql, pdo_mysql, pdo_pgsql, pdo_sqlite, zip
          coverage: none

      - name: Syntax check every PHP file
        run: |
          FAIL=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null || FAIL=1
          done < <(find . -name '*.php' -not -path './.git/*')
          exit $FAIL

      - name: PHPCompatibility scan (8.1 through 8.4)
        if: matrix.php == '8.4'
        run: |
          mkdir /tmp/compat && cd /tmp/compat
          composer init -n --name=evebb/compat-scan
          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --dev phpcompatibility/php-compatibility:dev-develop dealerdirect/phpcodesniffer-composer-installer
          ./vendor/bin/phpcs -p --standard=PHPCompatibility \
            --runtime-set testVersion 8.1- \
            --extensions=php --ignore='*/.git/*' \
            "$GITHUB_WORKSPACE"

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: evebb_e2e
          MARIADB_USER: flux
          MARIADB_PASSWORD: fluxpass
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flux
          POSTGRES_PASSWORD: fluxpass
          POSTGRES_DB: evebb_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U flux"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, mysqli, pgsql, pdo_mysql, pdo_pgsql, pdo_sqlite, zip
          coverage: none

      - name: Create secondary test databases
        run: php tests/ci/setup-dbs.php

      - name: Unit and characterization tests
        run: php tests/lite/run.php tests/functions tests/characterization

      - name: DB-layer contract tests (all five drivers)
        env:
          DB_HOST: 127.0.0.1
          DB_USER: flux
          DB_PASS: fluxpass
        run: |
          for t in mysqli mysql sqlite pgsql pgsql_pdo; do
            if [ "$t" = "sqlite" ]; then N=/tmp/evebb-contract.sqlite; rm -f "$N"; else N=evebb_test; fi
            echo "== contract: $t =="
            DB_TYPE=$t DB_NAME=$N php tests/lite/run.php tests/integration
          done

      - name: End-to-end tests (all five drivers)
        env:
          DB_HOST: 127.0.0.1
          DB_USER: flux
          DB_PASS: fluxpass
        run: |
          for t in mysqli mysql sqlite pgsql pgsql_pdo; do
            if [ "$t" = "sqlite" ]; then N=/tmp/evebb-e2e.sqlite; else N=evebb_e2e; fi
            DB_TYPE=$t DB_NAME=$N ./tests/e2e/run.sh
          done

      - name: Self-updater end-to-end test
        run: ./tests/e2e/update-test.sh

      - name: Toolbar plugin end-to-end test
        run: ./tests/e2e/toolbar-test.sh

      - name: Plugin manager end-to-end test
        run: ./tests/e2e/plugins-test.sh

      - name: Style manager end-to-end test
        run: ./tests/e2e/styles-test.sh
