# eveBB - nginx server block (one-click image)
# __PHP_VER__ is replaced with the installed PHP version at image build time.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/evebb;
    index index.php;
    server_name _;

    client_max_body_size 16m;

    location / {
        try_files $uri $uri/ /index.php;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php__PHP_VER__-fpm.sock;
    }

    # Never serve these directly. Note: .htaccess files do nothing under
    # nginx, so protections some plugins ship (e.g. the backup plugin's
    # cache/backups/.htaccess) are enforced here instead.
    location ~ /\.ht { deny all; }
    location ^~ /include/ { deny all; }
    location ^~ /cache/ { deny all; }
    location = /config.php { deny all; }

    # Static assets: long cache, eveBB busts with ?v=<version>
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
